<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImmoScout</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f4f6f9;color:#1a1a2e;min-height:100vh}
.top{background:#1e3a5f;padding:24px 24px 28px;color:#fff}
.top h1{font-size:22px;font-weight:700;margin-bottom:18px}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.7;font-weight:600}
.field input{padding:9px 12px;border:none;border-radius:8px;font-size:14px;font-weight:600;width:130px}
#inp-villes{width:200px}
.btn{padding:9px 22px;background:#10b981;color:#fff;border:none;border-radius:8px;
  font-size:14px;font-weight:700;cursor:pointer;align-self:flex-end}
.btn:hover{background:#059669}.btn:disabled{opacity:.5;cursor:not-allowed}

.status{padding:14px 24px;font-size:13px;font-weight:600;display:none}
.status.show{display:block}
.status.err{background:#fef2f2;color:#991b1b;border-bottom:2px solid #fecaca}
.status.info{background:#eff6ff;color:#1d4ed8;border-bottom:2px solid #bfdbfe}
.status.ok{background:#ecfdf5;color:#065f46;border-bottom:2px solid #6ee7b7}
.status a{color:inherit;font-weight:700}

#results{padding:20px 24px}
#count{font-size:13px;color:#64748b;font-weight:600;margin-bottom:14px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.08)}
th{background:#f8fafc;text-align:left;padding:11px 14px;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;color:#64748b;font-weight:700;border-bottom:2px solid #e2e8f0}
td{padding:12px 14px;border-bottom:1px solid #f1f5f9;font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.prix{font-weight:800;font-size:15px;color:#1e3a5f;white-space:nowrap}
.surf{color:#64748b;font-weight:600;white-space:nowrap}
.titre-cell{max-width:320px;line-height:1.4}
.lien-btn{display:inline-block;padding:6px 14px;background:#2563eb;color:#fff;border-radius:6px;
  font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.lien-btn:hover{background:#1d4ed8}
.empty{text-align:center;padding:50px;color:#94a3b8;font-size:15px}

@media(max-width:640px){
  .form{flex-direction:column}.field input,.field,.btn{width:100%}
  th:nth-child(2),td:nth-child(2){display:none}
}
</style>
</head>
<body>

<div class="top">
  <h1>ImmoScout — Annonces PAP.fr</h1>
  <div class="form">
    <div class="field">
      <label>Ville(s) — séparer par virgule</label>
      <input id="inp-villes" type="text" placeholder="Paris, Lyon, Bordeaux" value="Paris">
    </div>
    <div class="field">
      <label>Budget max (€)</label>
      <input id="inp-budget" type="number" value="300000">
    </div>
    <div class="field">
      <label>Surface min (m²)</label>
      <input id="inp-surf" type="number" value="20">
    </div>
    <button class="btn" id="btn-scan" onclick="scan()">🔍 Scanner</button>
  </div>
</div>

<div class="status" id="status"></div>

<div id="results" style="display:none">
  <div id="count"></div>
  <table>
    <thead>
      <tr>
        <th>Bien</th>
        <th>Surface</th>
        <th>Prix</th>
        <th>Annonce</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
function fmt(n){return n?Math.round(n).toLocaleString('fr-FR')+'€':'—'}
function setStatus(msg,cls){
  const el=document.getElementById('status');
  el.innerHTML=msg;el.className='status show '+cls;
}

async function scan(){
  const villes=document.getElementById('inp-villes').value.split(',').map(v=>v.trim()).filter(Boolean);
  const budget=parseInt(document.getElementById('inp-budget').value)||300000;
  const surf=parseInt(document.getElementById('inp-surf').value)||0;
  if(!villes.length){setStatus('Entrez au moins une ville.','err');return;}

  const btn=document.getElementById('btn-scan');
  btn.disabled=true;btn.textContent='⏳ Scan...';
  document.getElementById('results').style.display='none';
  setStatus('Scan PAP.fr en cours...','info');

  try{
    const r=await fetch('/api/search',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({villes,budgetMax:budget,surfMin:surf})
    });
    const data=await r.json();
    const listings=data.listings||[];

    if(!listings.length){
      let msg='Aucune annonce trouvée.';
      if(data.errors?.length) msg+=' Erreurs : '+data.errors.join(' | ');
      msg+=` <a href="/api/debug?ville=${encodeURIComponent(villes[0])}" target="_blank">Diagnostic →</a>`;
      setStatus(msg,'err');
    } else {
      setStatus(`✅ ${listings.length} annonce${listings.length>1?'s':''} trouvée${listings.length>1?'s':''}. Cliquez sur "Voir" pour ouvrir l'annonce exacte.`,'ok');
      renderTable(listings);
    }
  }catch(e){
    setStatus('Erreur réseau : '+e.message,'err');
  }finally{
    btn.disabled=false;btn.textContent='🔍 Scanner';
  }
}

function renderTable(listings){
  const tb=document.getElementById('tbody');
  tb.innerHTML=listings.map(l=>`
    <tr>
      <td class="titre-cell">${esc(l.titre)}</td>
      <td class="surf">${l.surf?l.surf+' m²':'—'}</td>
      <td class="prix">${fmt(l.prix)}</td>
      <td><a class="lien-btn" href="${esc(l.url)}" target="_blank" rel="noopener">Voir →</a></td>
    </tr>
  `).join('');
  document.getElementById('count').textContent=listings.length+' annonce'+(listings.length>1?'s':'')+' — cliquer "Voir" ouvre directement la vraie annonce PAP.fr';
  document.getElementById('results').style.display='block';
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

document.addEventListener('keydown',e=>{if(e.key==='Enter')scan();});
</script>
</body>
</html>
